name: Mirror to Epitech repository

on:
  push:
    branches: ["main"]


jobs:
  mirror_to_epitech:
    if: github.repository == 'Maeva2630/Sensai_Mirror'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Push to Epitech repository
        run: |
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git remote add epitech git@github.com:EpitechPGE3-2026/G-AIA-500-MPL-5-1-sensai-3.git
          git push --force epitech HEAD:main
